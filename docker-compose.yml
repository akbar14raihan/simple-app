   name: simple-app
   services:
     db:
       image: postgres:16-alpine
       environment:
         POSTGRES_DB: appdb
         POSTGRES_USER: appuser
         POSTGRES_PASSWORD: apppass
       volumes:
         - dbdata:/var/lib/postgresql/data
       healthcheck:
         test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
         interval: 5s
         retries: 10
     app:
       build: .
       image: nightrunnerr/simple-app:latest
       depends_on:
         db:
           condition: service_healthy
       environment:
         DB_HOST: db
       ports:
         - "5000:5000"
   volumes:
     dbdata:
